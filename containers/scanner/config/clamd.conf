# clamd for the isolated scanner. Unix socket only; no TCP listener.
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
Foreground no
User clamav
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
MaxThreads 4
MaxQueue 32
ReadTimeout 60
CommandReadTimeout 10
# Streams and archive expansion are bounded (§10: archive bombs, recursion, decompression ratio).
StreamMaxLength 100M
MaxScanSize 400M
MaxFileSize 100M
MaxRecursion 16
MaxFiles 10000
MaxScanTime 60000
MaxEmbeddedPE 40M
MaxHTMLNormalize 40M
MaxZipTypeRcg 1M
AlertExceedsMax yes
AlertEncrypted yes
AlertBrokenExecutables yes
AlertOLE2Macros yes
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanArchive yes
Bytecode yes
