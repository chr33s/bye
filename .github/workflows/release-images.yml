# Release images for hosted onboarding (infra/onboarding/spec.md §44, §45): the deployer (the
# release checkout + its job server) and the prebuilt MIME and SigMirror containers, pushed to GHCR
# as single-platform linux/amd64 manifests. Onboarding copies them byte for byte into each
# installation's account registry, so the digests printed here are what release-manifest.ts pins
# (with a scanner digest from scanner-image.yml). Make the packages public so onboarding can pull
# them anonymously. Opt-in with the onboarding service: runs only when vars.BYE_ONBOARDING is 'true'.
name: release-images

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.18.1"
  PNPM_VERSION: "12.8.1"

jobs:
  images:
    if: vars.BYE_ONBOARDING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Resolve (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Bundle the MIME server
        run: pnpm build:mime
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (single-platform manifests)
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          repo="ghcr.io/${GITHUB_REPOSITORY}"
          build() { # name, dockerfile, context, extra args…
            name="$1"; file="$2"; ctx="$3"; shift 3
            docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
              --push -f "$file" -t "$repo/$name:$REF_NAME" --metadata-file "/tmp/$name.json" "$@" "$ctx"
            digest="$(jq -r '."containerimage.digest"' "/tmp/$name.json")"
            echo "--$name $repo/$name@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          build deployer infra/onboarding/deployer/Dockerfile . --build-arg "BYE_RELEASE_COMMIT=$GITHUB_SHA"
          build mime containers/mime/Dockerfile containers/mime
          build sigmirror containers/sigmirror/Dockerfile containers/sigmirror
