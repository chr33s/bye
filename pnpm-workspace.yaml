packages:
  - packages/*
  - workers/*
  - apps/*
  # React Native hosts install with npm (flat node_modules for native autolinking/CocoaPods).
  - "!apps/mobile"
  - "!apps/desktop"
  - infra
allowBuilds:
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261002.1"
  - "@types/node@26.6.4"
  - effect@4.0.0
overrides:
  "@effect/sql-d1": 4.0.0
  "@effect/sql-sqlite-do": 4.0.0
  "@effect/platform-node-shared": 4.0.0
  "@effect/vitest": 4.0.0
  effect: 4.0.0
patchedDependencies:
  # Alchemy and Distilled still import the Effect 4 RC module paths.
  effect@4.0.0: patches/effect@4.0.0.patch
