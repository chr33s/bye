packages:
  - packages/*
  - workers/*
  - apps/*
  # React Native hosts install with npm (flat node_modules for native autolinking/CocoaPods).
  - "!apps/mobile"
  - "!apps/desktop"
  - infra
allowBuilds:
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260928.1"
overrides:
