packages:
  - packages/*
  - workers/*
  - apps/*
  # React Native hosts install with npm (flat node_modules for native autolinking/CocoaPods).
  - "!apps/mobile"
  - "!apps/desktop"
  - infra
allowBuilds:
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261008.1"
  - "@types/node@26.6.4"
  - effect@4.0.2
  - "@effect/platform-bun@4.0.2"
  - "@effect/platform-node-shared@4.0.2"
  - "@effect/platform-node@4.0.2"
  - "@effect/sql-d1@4.0.2"
  - "@effect/sql-sqlite-do@4.0.2"
  - "@effect/vitest@4.0.2"
overrides:
  "@effect/sql-d1": 4.0.2
  "@effect/sql-sqlite-do": 4.0.2
  "@effect/platform-node-shared": 4.0.2
  "@effect/vitest": 4.0.2
  effect: 4.0.2
